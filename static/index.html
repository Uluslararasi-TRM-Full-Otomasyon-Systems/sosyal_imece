<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Agent Dashboard - Multi-Agent System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e4e4e4;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            font-size: 1.3em;
            color: #a0a0a0;
        }
        
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn.start {
            background: linear-gradient(90deg, #4CAF50, #45a049);
        }
        
        .control-btn.stop {
            background: linear-gradient(90deg, #f44336, #da190b);
        }
        
        .control-btn.affiliate {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .control-btn.loading {
            opacity: 0.7;
            cursor: wait;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .stat-item .value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-item .label {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-top: 5px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .agent-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--agent-color);
        }
        
        .agent-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--agent-color);
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .agent-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
            font-weight: bold;
            background: var(--agent-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .agent-avatar .flag {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .agent-info h3 {
            font-size: 1.5em;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .agent-info p {
            font-size: 0.95em;
            color: #a0a0a0;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-badge.active {
            background: linear-gradient(90deg, #4CAF50, #45a049);
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-badge.idle {
            background: linear-gradient(90deg, #9E9E9E, #757575);
            color: white;
        }
        
        .status-badge.inactive {
            background: linear-gradient(90deg, #f44336, #da190b);
            color: white;
        }
        
        .status-badge.busy {
            background: linear-gradient(90deg, #FF9800, #f57c00);
            color: white;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .task-section {
            margin-bottom: 15px;
        }
        
        .task-section h4 {
            font-size: 0.85em;
            color: #667eea;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .task-section p {
            font-size: 1.1em;
            color: #fff;
            font-weight: 500;
        }
        
        .log-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .log-section::-webkit-scrollbar {
            width: 6px;
        }
        
        .log-section::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .log-section::-webkit-scrollbar-thumb {
            background: var(--agent-color);
            border-radius: 3px;
        }
        
        .log-section h4 {
            font-size: 0.85em;
            color: #667eea;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .log-entry {
            font-size: 0.9em;
            color: #e4e4e4;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-entry .timestamp {
            color: #667eea;
            font-size: 0.8em;
            margin-right: 10px;
            min-width: 60px;
        }
        
        .log-entry .icon {
            margin-right: 8px;
            color: var(--agent-color);
        }
        
        .bus-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .bus-header h2 {
            font-size: 1.8em;
            color: #fff;
        }
        
        .bus-header .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4CAF50;
            font-weight: bold;
            background: rgba(76, 175, 80, 0.1);
            padding: 8px 20px;
            border-radius: 25px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        
        .live-indicator .dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 1s infinite;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        
        .live-stream-badge {
            display: inline-block;
            background: linear-gradient(90deg, #FF0000, #CC0000);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        
        .bus-messages {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .bus-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .bus-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        .bus-messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
        
        .bus-message {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .bus-message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .bus-message-source {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }
        
        .bus-message-type {
            font-size: 0.85em;
            color: #a0a0a0;
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 10px;
            border-radius: 15px;
        }
        
        .bus-message-content {
            font-size: 1em;
            color: #e4e4e4;
            line-height: 1.5;
        }
        
        .bus-message-timestamp {
            font-size: 0.8em;
            color: #667eea;
            margin-top: 8px;
        }
        
        @media (max-width: 1400px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 1100px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .stats-bar {
                flex-direction: column;
                align-items: center;
            }
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #a0a0a0;
        }
        
        .loading i {
            font-size: 3em;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agent Dashboard</h1>
            <p>Multi-Agent System - Real-time Monitoring & Control</p>
        </div>
        
        <div class="control-bar">
            <button class="control-btn start" id="btn-start-all" onclick="startAllAgents()">
                <i class="fas fa-play"></i> Tüm Ajanları Başlat
            </button>
            <button class="control-btn stop" id="btn-stop-all" onclick="stopAllAgents()">
                <i class="fas fa-stop"></i> Sistemi Durdur
            </button>
            <button class="control-btn affiliate" id="btn-affiliate" onclick="triggerAffiliateTask()">
                <i class="fas fa-dollar-sign"></i> Affiliate Görevini Tetikle
            </button>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="value" id="total-agents">8</div>
                <div class="label">Total Agents</div>
            </div>
            <div class="stat-item">
                <div class="value" id="active-agents">0</div>
                <div class="label">Active Agents</div>
            </div>
            <div class="stat-item">
                <div class="value" id="total-messages">0</div>
                <div class="label">Bus Messages</div>
            </div>
            <div class="stat-item">
                <div class="value" id="uptime">00:00:00</div>
                <div class="label">Uptime</div>
            </div>
        </div>
        
        <div class="grid" id="agent-grid">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Loading agents...</p>
            </div>
        </div>
        
        <div class="bus-section">
            <div class="bus-header">
                <h2>📡 Inter-Agent Bus <span class="live-stream-badge">LIVE STREAM</span></h2>
                <div class="live-indicator">
                    <div class="dot"></div>
                    <span>LIVE</span>
                </div>
            </div>
            <div class="bus-messages" id="bus-messages">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading messages...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Agent configurations
        const agentConfigs = {
            'elif': {
                color: '#FF6B6B',
                emoji: '🎭',
                flag: '🇹🇷',
                description: 'Content Strategy & Planning',
                theme: 'turkish'
            },
            'amara': {
                color: '#4ECDC4',
                emoji: '📱',
                flag: '🇮🇳',
                description: 'Social Media Distribution',
                theme: 'indian'
            },
            'lucia': {
                color: '#45B7D1',
                emoji: '📊',
                flag: '🇮🇹',
                description: 'Analytics & Monitoring',
                theme: 'italian'
            },
            'sophie': {
                color: '#96CEB4',
                emoji: '💬',
                flag: '🇫🇷',
                description: 'Customer Engagement',
                theme: 'french'
            },
            'emma': {
                color: '#FFEAA7',
                emoji: '💰',
                flag: '🇬🇧',
                description: 'Financial & Accounting',
                theme: 'british'
            },
            'yuki': {
                color: '#DDA0DD',
                emoji: '🤖',
                flag: '🇯🇵',
                description: 'AI & Automation',
                theme: 'japanese'
            },
            'alina': {
                color: '#F39C12',
                emoji: '✅',
                flag: '🇷🇴',
                description: 'Quality Assurance & Testing',
                theme: 'romanian'
            },
            'camille': {
                color: '#E74C3C',
                emoji: '🔒',
                flag: '🇨🇦',
                description: 'Security & Compliance',
                theme: 'canadian'
            }
        };
        
        const statusIcons = {
            'active': 'fa-check-circle',
            'idle': 'fa-pause-circle',
            'inactive': 'fa-times-circle',
            'busy': 'fa-clock'
        };
        
        let startTime = new Date();
        let messageCount = 0;
        
        // Update uptime
        function updateUptime() {
            const now = new Date();
            const diff = now - startTime;
            const hours = Math.floor(diff / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            
            document.getElementById('uptime').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        setInterval(updateUptime, 1000);
        
        // Control functions
        async function startAllAgents() {
            const btn = document.getElementById('btn-start-all');
            btn.disabled = true;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Başlatılıyor...';
            
            try {
                const response = await fetch('/api/agents/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    btn.innerHTML = '<i class="fas fa-check"></i> Başlatıldı';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-play"></i> Tüm Ajanları Başlat';
                        btn.disabled = false;
                        btn.classList.remove('loading');
                    }, 2000);
                } else {
                    btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Hata';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-play"></i> Tüm Ajanları Başlat';
                        btn.disabled = false;
                        btn.classList.remove('loading');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error starting agents:', error);
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Hata';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-play"></i> Tüm Ajanları Başlat';
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }, 2000);
            }
        }
        
        async function stopAllAgents() {
            const btn = document.getElementById('btn-stop-all');
            btn.disabled = true;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Durduruluyor...';
            
            try {
                const response = await fetch('/api/agents/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    btn.innerHTML = '<i class="fas fa-check"></i> Durduruldu';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-stop"></i> Sistemi Durdur';
                        btn.disabled = false;
                        btn.classList.remove('loading');
                    }, 2000);
                } else {
                    btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Hata';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-stop"></i> Sistemi Durdur';
                        btn.disabled = false;
                        btn.classList.remove('loading');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error stopping agents:', error);
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Hata';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-stop"></i> Sistemi Durdur';
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }, 2000);
            }
        }
        
        async function triggerAffiliateTask() {
            const btn = document.getElementById('btn-affiliate');
            btn.disabled = true;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Tetikleniyor...';
            
            try {
                const response = await fetch('/api/affiliate/trigger', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    btn.innerHTML = '<i class="fas fa-check"></i> Tetiklendi';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-dollar-sign"></i> Affiliate Görevini Tetikle';
                        btn.disabled = false;
                        btn.classList.remove('loading');
                    }, 2000);
                } else {
                    btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Hata';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-dollar-sign"></i> Affiliate Görevini Tetikle';
                        btn.disabled = false;
                        btn.classList.remove('loading');
                    }, 2000);
                }
            } catch (error) {
                console.error('Error triggering affiliate task:', error);
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Hata';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-dollar-sign"></i> Affiliate Görevini Tetikle';
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }, 2000);
            }
        }
        
        // Load agents
        async function loadAgents() {
            try {
                const response = await fetch('/api/agents');
                const agents = await response.json();
                
                document.getElementById('total-agents').textContent = agents.length;
                
                const grid = document.getElementById('agent-grid');
                grid.innerHTML = '';
                
                agents.forEach(agent => {
                    const config = agentConfigs[agent.id] || {
                        color: '#667eea',
                        emoji: '🤖',
                        flag: '🌍',
                        description: agent.description,
                        theme: 'default'
                    };
                    
                    const card = document.createElement('div');
                    card.className = 'agent-card';
                    card.style.setProperty('--agent-color', config.color);
                    card.innerHTML = `
                        <div class="agent-header">
                            <div class="agent-avatar">
                                ${config.emoji}
                                <span class="flag">${config.flag}</span>
                            </div>
                            <div class="agent-info">
                                <h3>${agent.name}</h3>
                                <p>${config.description}</p>
                            </div>
                        </div>
                        <div class="status-badge active" id="status-${agent.id}">
                            <i class="fas ${statusIcons['active']}"></i> Active
                        </div>
                        <div class="task-section">
                            <h4><i class="fas fa-tasks"></i> Current Task</h4>
                            <p id="task-${agent.id}">Loading...</p>
                        </div>
                        <div class="log-section">
                            <h4><i class="fas fa-history"></i> Recent Logs</h4>
                            <div id="logs-${agent.id}">
                                <div class="log-entry">
                                    <span class="timestamp">--:--</span>
                                    <span class="icon"><i class="fas fa-spinner fa-spin"></i></span>
                                    <span>Loading logs...</span>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                // Load agent states
                loadAgentStates();
            } catch (error) {
                console.error('Error loading agents:', error);
                document.getElementById('agent-grid').innerHTML = `
                    <div class="loading">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading agents</p>
                    </div>
                `;
            }
        }
        
        // Load agent states
        async function loadAgentStates() {
            try {
                const response = await fetch('/api/agents/states');
                const states = await response.json();
                
                let activeCount = 0;
                
                for (const [agentId, state] of Object.entries(states)) {
                    const statusEl = document.getElementById(`status-${agentId}`);
                    const taskEl = document.getElementById(`task-${agentId}`);
                    
                    if (statusEl) {
                        const icon = statusIcons[state.status] || statusIcons['active'];
                        statusEl.className = `status-badge ${state.status}`;
                        statusEl.innerHTML = `<i class="fas ${icon}"></i> ${state.status.charAt(0).toUpperCase() + state.status.slice(1)}`;
                        
                        if (state.status === 'active') {
                            activeCount++;
                        }
                    }
                    
                    if (taskEl) {
                        taskEl.textContent = state.task || 'No active task';
                    }
                }
                
                document.getElementById('active-agents').textContent = activeCount;
                
                // Load logs for each agent
                for (const agentId of Object.keys(states)) {
                    loadAgentLogs(agentId);
                }
            } catch (error) {
                console.error('Error loading agent states:', error);
            }
        }
        
        // Load agent logs
        async function loadAgentLogs(agentId) {
            try {
                const response = await fetch(`/api/agents/${agentId}/logs?limit=5`);
                const logs = await response.json();
                
                const logsEl = document.getElementById(`logs-${agentId}`);
                if (logsEl) {
                    const config = agentConfigs[agentId] || { color: '#667eea' };
                    
                    if (logs.length === 0) {
                        logsEl.innerHTML = `
                            <div class="log-entry">
                                <span class="timestamp">--:--</span>
                                <span class="icon"><i class="fas fa-info-circle"></i></span>
                                <span>No logs available</span>
                            </div>
                        `;
                    } else {
                        logsEl.innerHTML = logs.map(log => `
                            <div class="log-entry">
                                <span class="timestamp">${new Date(log.timestamp).toLocaleTimeString()}</span>
                                <span class="icon"><i class="fas fa-check" style="color: ${config.color}"></i></span>
                                <span>${log.message}</span>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error(`Error loading logs for ${agentId}:`, error);
            }
        }
        
        // Load bus messages
        async function loadBusMessages() {
            try {
                const response = await fetch('/api/bus/messages?limit=15');
                const messages = await response.json();
                
                const busEl = document.getElementById('bus-messages');
                if (busEl) {
                    messageCount = messages.length;
                    document.getElementById('total-messages').textContent = messageCount;
                    
                    if (messages.length === 0) {
                        busEl.innerHTML = `
                            <div class="loading">
                                <i class="fas fa-info-circle"></i>
                                <p>No messages available</p>
                            </div>
                        `;
                    } else {
                        busEl.innerHTML = messages.map(msg => {
                            const sourceConfig = agentConfigs[msg.source] || { color: '#667eea' };
                            return `
                                <div class="bus-message" style="border-left-color: ${sourceConfig.color}">
                                    <div class="bus-message-header">
                                        <span class="bus-message-source">
                                            <i class="fas fa-robot"></i> ${msg.source || 'Unknown'}
                                        </span>
                                        <span class="bus-message-type">${msg.type || 'info'}</span>
                                    </div>
                                    <div class="bus-message-content">${msg.message || msg.content || 'No content'}</div>
                                    <div class="bus-message-timestamp">
                                        <i class="fas fa-clock"></i> ${new Date(msg.timestamp).toLocaleString()}
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading bus messages:', error);
            }
        }
        
        // WebSocket connection for real-time updates
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'agent_state') {
                    const statusEl = document.getElementById(`status-${data.agent_id}`);
                    const taskEl = document.getElementById(`task-${data.agent_id}`);
                    
                    if (statusEl) {
                        const icon = statusIcons[data.status] || statusIcons['active'];
                        statusEl.className = `status-badge ${data.status}`;
                        statusEl.innerHTML = `<i class="fas ${icon}"></i> ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}`;
                    }
                    
                    if (taskEl) {
                        taskEl.textContent = data.task || 'No active task';
                    }
                    
                    // Update active count
                    loadAgentStates();
                } else if (data.type === 'agent_log') {
                    // Update last log directly
                    const logsEl = document.getElementById(`logs-${data.agent_id}`);
                    if (logsEl) {
                        const config = agentConfigs[data.agent_id] || { color: '#667eea' };
                        const timestamp = new Date().toLocaleTimeString();
                        logsEl.innerHTML = `
                            <div class="log-entry">
                                <span class="timestamp">${timestamp}</span>
                                <span class="icon"><i class="fas fa-check" style="color: ${config.color}"></i></span>
                                <span>${data.log}</span>
                            </div>
                        ` + logsEl.innerHTML;
                    }
                } else if (data.type === 'bus_message') {
                    // Add new message to bus directly
                    const busEl = document.getElementById('bus-messages');
                    if (busEl && !busEl.querySelector('.loading')) {
                        const sourceConfig = agentConfigs[data.source] || { color: '#667eea' };
                        const messageHtml = `
                            <div class="bus-message" style="border-left-color: ${sourceConfig.color}; animation: slideIn 0.3s ease;">
                                <div class="bus-message-header">
                                    <span class="bus-message-source">
                                        <i class="fas fa-robot"></i> ${data.source || 'Unknown'}
                                    </span>
                                    <span class="bus-message-type">${data.type || 'info'}</span>
                                </div>
                                <div class="bus-message-content">${data.message || data.content || 'No content'}</div>
                                <div class="bus-message-timestamp">
                                    <i class="fas fa-clock"></i> ${new Date().toLocaleString()}
                                </div>
                            </div>
                        `;
                        busEl.innerHTML = messageHtml + busEl.innerHTML;
                        
                        // Keep only last 20 messages
                        const messages = busEl.querySelectorAll('.bus-message');
                        if (messages.length > 20) {
                            for (let i = 20; i < messages.length; i++) {
                                messages[i].remove();
                            }
                        }
                        
                        // Update message count
                        messageCount++;
                        document.getElementById('total-messages').textContent = messageCount;
                    }
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected, reconnecting...');
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        // Initial load
        loadAgents();
        loadBusMessages();
        connectWebSocket();
        
        // Refresh every 5 seconds
        setInterval(() => {
            loadAgentStates();
            loadBusMessages();
        }, 5000);
    </script>
</body>
</html>
